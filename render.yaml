# Render Blueprint: New > Blueprint > pick this repo, then fill in the Redis values.
services:
  - type: web
    name: cuteurl
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_USERNAME
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://m4nuel-ceron.github.io
